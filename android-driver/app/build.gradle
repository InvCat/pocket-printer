plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
}

def keystorePropsFile = rootProject.file("signing/keystore.properties")
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}

android {
    namespace "com.tronic.pocketprintservice"
    compileSdk 34

    defaultConfig {
        applicationId "com.tronic.pocketprintservice"
        minSdk 26
        targetSdk 34
        versionCode 8
        versionName "0.1.7"
    }

    signingConfigs {
        // Stable project key so CI + local APKs upgrade without uninstall.
        if (keystorePropsFile.exists()) {
            create("release") {
                storeFile rootProject.file("signing/${keystoreProps['storeFile']}")
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            if (keystorePropsFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            if (keystorePropsFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
    implementation "androidx.core:core-ktx:1.13.1"
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "com.google.android.material:material:1.12.0"
}
